<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F131D"/>
      <stop offset="50%" stop-color="#08090C"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B75"/>
      <stop offset="50%" stop-color="#FF4B55"/>
      <stop offset="100%" stop-color="#E02E39"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="60%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="32" y="32" width="960" height="960" rx="240" fill="url(#bgGrad)" stroke="#1F2433" stroke-width="8"/>

  <!-- Ambient background glow circles -->
  <circle cx="340" cy="460" r="280" fill="#FF4B55" opacity="0.12" filter="url(#crimsonGlow)"/>
  <circle cx="680" cy="560" r="240" fill="#06B6D4" opacity="0.10" filter="url(#cyanGlow)"/>

  <!-- Geometric "D" Synq Symbol -->
  <!-- Left vertical pillar with stylized rounded caps -->
  <rect x="290" y="270" width="104" height="484" rx="52" fill="url(#crimsonGrad)" filter="url(#crimsonGlow)"/>

  <!-- Primary dynamic curved loop of "D" -->
  <path d="M 394 290 
           C 610 290, 770 380, 770 512 
           C 770 644, 610 734, 394 734" 
        fill="none" stroke="url(#crimsonGrad)" stroke-width="104" stroke-linecap="round" filter="url(#crimsonGlow)"/>

  <!-- Sync overlay loop in vibrant cyan -->
  <path d="M 460 380 
           C 620 380, 670 440, 670 512
           C 670 584, 620 644, 460 644" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="48" stroke-linecap="round" filter="url(#cyanGlow)"/>

  <!-- Synq nodes / pulse points -->
  <circle cx="460" cy="380" r="32" fill="#22D3EE" filter="url(#cyanGlow)"/>
  <circle cx="460" cy="644" r="32" fill="#FF4B55" filter="url(#crimsonGlow)"/>
  <circle cx="670" cy="512" r="24" fill="#FFFFFF"/>
</svg>